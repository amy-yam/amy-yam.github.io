<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amy Personal</title>
  <!-- Apply saved theme BEFORE first paint to prevent a flash on navigation -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") ||
          ((window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="brand">Amy</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="personal.html">Personal</a>
        <a href="doing.html">What I'm Doing</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="search-wrap">
        <input id="site-search" type="text" placeholder="Search…" autocomplete="off" />
        <div id="search-results" class="search-results"></div>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
  </nav>
  <main class="container">
    <h1>Personal</h1>
    <p class="lead">Some of the things I do outside of work. Click a heading to expand it.</p>
    <div class="collapsible" id="photography">
      <button onclick="toggleCollapsible(this)">Photography <span class="chev">›</span></button>
      <div class="panel">
        <p>A few favorite shots. Click any photo to view it larger.</p>
        <!-- IMAGE GALLERY
             To use your own photos: replace each `src` with your thumbnail
             (or the full image) and `data-full` with the large version.
             The `alt` text becomes the lightbox caption. Add or remove
             <figure> blocks freely — the grid and lightbox adapt. -->
        <div class="gallery" id="photo-gallery">
          <figure class="gallery-item">
            <img src="https://picsum.photos/seed/yam-a/400/400"
                 data-full="https://picsum.photos/seed/yam-a/1400/1400"
                 alt="Placeholder photo 1" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="https://picsum.photos/seed/yam-b/400/400"
                 data-full="https://picsum.photos/seed/yam-b/1400/1400"
                 alt="Placeholder photo 2" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="https://picsum.photos/seed/yam-c/400/400"
                 data-full="https://picsum.photos/seed/yam-c/1400/1400"
                 alt="Placeholder photo 3" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="https://picsum.photos/seed/yam-d/400/400"
                 data-full="https://picsum.photos/seed/yam-d/1400/1400"
                 alt="Placeholder photo 4" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="https://picsum.photos/seed/yam-e/400/400"
                 data-full="https://picsum.photos/seed/yam-e/1400/1400"
                 alt="Placeholder photo 5" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="https://picsum.photos/seed/yam-f/400/400"
                 data-full="https://picsum.photos/seed/yam-f/1400/1400"
                 alt="Placeholder photo 6" loading="lazy" />
          </figure>
        </div>
      </div>
    </div>
    <div class="collapsible" id="fiber-arts">
      <button onclick="toggleCollapsible(this)">Fiber Arts <span class="chev">›</span></button>
      <div class="panel">

      <span>© <span id="year">2026</span> yam</span>
      <span>
        <a href="mailto:the.wang.amy@gmail.com">Email</a> ·
